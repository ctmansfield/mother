services:
  redis:
    image: redis:7
    ports: ["6379:6379"]

  smtp:
    image: mailhog/mailhog:latest
    ports: ["8025:8025","1025:1025"]

  mother:
    build: ./
    env_file: ["../.env.shared"]
    # Allow containers to resolve host as host.docker.internal (Linux)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [redis, smtp]
    ports: ["18081:8080"]

  coach:
    build:
      context: ../coach
    env_file: ["../.env.shared"]
    depends_on: [mother, redis]
    command: ["python","-m","coach_app.cli.plan_now","--user","00000000-0000-0000-0000-000000000001","--hours","4","--goals","deep_work,hydration,walk"]

  health_portal:
    build:
      context: ../health_portal
    env_file: ["../.env.shared"]
    depends_on: [mother]
    ports: ["13000:3000"]
