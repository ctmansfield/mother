[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mother"
version = "0.2.0"
description = "Mother API and CLI"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.26",
  "pydantic>=2",
  "typer>=0.9",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "PyYAML>=6"
]

[project.optional-dependencies]
physiology = ["pandas>=2", "pyarrow>=15", "jsonschema>=4.18", "defusedxml>=0.7"]
physiology-test = ["pytest>=7.4", "pandas>=2", "pyarrow>=15", "jsonschema>=4.18", "defusedxml>=0.7"]

[project.scripts]
mother = "mother.facehugger.cli:app"

[tool.setuptools]
package-dir = {"" = "."}


[tool.setuptools.packages.find]
include = ["mother*", "analytics*"]
exclude = ["ops*", "scripts*", "tests*", "analytics.tests*"]

[tool.setuptools.package-data]
"mother.physiology" = ["schemas/*.json", "migrations/*.sql", "fixtures/*"]
"analytics" = ["config/*.yaml"]
[tool.black]
line-length = 88
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py311"
