services:
  vllm-5005:
    image: vllm:cu121-ok
    runtime: nvidia
    restart: unless-stopped
    ports:
      - "5005:8000"
    volumes:
      - /mnt/llmstore/hf:/hf:ro
    command: [
      "--model","/hf/Qwen2.5-Coder-7B-Instruct",
      "--served-model-name","qwen2.5-coder-7b-instruct",
      "--dtype","float16",
      "--max-model-len","8192",
      "--gpu-memory-utilization","0.92"
    ]
    healthcheck:
      test: ["CMD-SHELL","curl -fsS http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 10s

  openai-proxy:
    image: python:3.11-slim
    restart: unless-stopped
    working_dir: /app
    environment:
      UPSTREAM: http://vllm-5005:8000
      OPENAI_PROXY_KEY: ${OPENAI_PROXY_KEY}
    ports:
      - "8001:8001"
    volumes:
      - ./openai_proxy.py:/app/openai_proxy.py:ro
    command: >
      bash -lc "pip install --no-cache-dir fastapi uvicorn httpx &&
                uvicorn openai_proxy:app --host 0.0.0.0 --port 8001"
    depends_on:
      vllm-5005:
        condition: service_healthy

  mother-api:
    image: python:3.11-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../:/app
    environment:
      MOTHER_MODEL_ENDPOINT: ${MOTHER_MODEL_ENDPOINT}
      MOTHER_DB_DSN: ${MOTHER_DB_DSN}
    command: >
      bash -lc "pip install -e . &&
                uvicorn mother.api:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      vllm-5005:
        condition: service_healthy

  mother-worker:
    image: python:3.11-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../:/app
    environment:
      MOTHER_MODEL_ENDPOINT: ${MOTHER_MODEL_ENDPOINT}
      MOTHER_DB_DSN: ${MOTHER_DB_DSN}
    command: >
      bash -lc "pip install -e . &&
                python -c 'import time; print(\"worker online\"); time.sleep(360000)'"
    depends_on:
      vllm-5005:
        condition: service_healthy
