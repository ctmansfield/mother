name: Strict combined MOTHER-COACH offline qualification
on:
  push:
    branches:
      - review/mother-strict-offline-ci-20261120
  pull_request:
    paths:
      - .github/workflows/strict-combined-offline.yml
      - analytics/**
      - mother/physiology/**
      - tests/physiology/**
permissions:
  contents: read

jobs:
  strict-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install explicit offline test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt 'jsonschema>=4.18,<5' 'defusedxml>=0.7' 'setuptools>=69' wheel
      - name: Combined physiology and analytics pytest; failures are fatal
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -B -m pytest -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/strict-combined.xml" tests/physiology/test_contracts.py tests/physiology/test_evaluation.py tests/physiology/test_evaluation_independent.py tests/physiology/test_import_replay.py tests/physiology/test_independent_acceptance.py analytics/tests
      - name: Verify actual test count and exactly the tracked optional skip
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path(os.environ["RUNNER_TEMP"]) / "strict-combined.xml"
          root = ET.parse(p).getroot()
          cases = list(root.iter("testcase"))
          skips = [case for case in cases if case.find("skipped") is not None]
          failures = [case for case in cases if case.find("failure") is not None or case.find("error") is not None]
          print("CASES", len(cases), "SKIPS", len(skips), "FAILURES", len(failures))
          if len(cases) < 150 or failures:
              raise SystemExit("Combined pytest gate did not execute the required cases")
          if len(skips) != 1 or skips[0].get("name") != "test_pid_broja_two_sources":
              raise SystemExit("Unexpected pytest skip; see MOTHER issue #19")
          print("PASS: all executed cases passed; one separately tracked BROJA PID skip")
          PY
      - name: Verify E1 structural register
        run: python -B research/e1/verify_register.py
      - name: Verify complete preserved MSE reference
        run: python -B tools/verify_mse_reference.py --all

  pinned-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ctmansfield/coach
          ref: 493ed9ca1f746546eb8c19a85c3e30643cc80ded
          path: paired-coach
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install paired offline test dependencies
        run: |
          python -m pip install --disable-pip-version-check 'jsonschema>=4.18,<5' 'defusedxml>=0.7'
      - name: Verify exact combined COACH commit
        run: |
          test "$(git -C paired-coach rev-parse HEAD)" = "493ed9ca1f746546eb8c19a85c3e30643cc80ded"
      - name: Run five actual combined-source interface suites, reject skips
        env:
          COACH_CHECKOUT: paired-coach
          PYTHONPATH: .:paired-coach
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          python -B - <<'PY'
          import sys
          import unittest
          patterns = [
              "test_handoff_crossrepo.py",
              "test_capture_ui_crossrepo.py",
              "test_receipt_recovery.py",
              "test_delivery_state.py",
              "test_delivery_state_coach.py",
          ]
          count = 0
          for pattern in patterns:
              suite = unittest.TestLoader().discover("tests/physiology", pattern=pattern)
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              print("SUITE", pattern, "TESTS", result.testsRun,
                    "SKIPS", len(result.skipped),
                    "ERRORS", len(result.errors), "FAILURES", len(result.failures))
              if not result.wasSuccessful() or result.skipped or result.testsRun < 1:
                  sys.exit(1)
              count += result.testsRun
          if count != 45:
              raise SystemExit("Combined interface test count changed; review required")
          print("PASS: 45 integrated interface cases, zero skips")
          PY
