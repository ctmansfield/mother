name: I01 durable local receipt recovery (offline)

on:
  pull_request:
    paths:
      - 'mother/physiology/receipt_recovery.py'
      - 'tests/physiology/test_receipt_recovery.py'
      - '.github/workflows/i01-receipt-recovery.yml'
  push:
    branches:
      - 'work/i01-offline-receipt-recovery'

permissions:
  contents: read

jobs:
  synthetic-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Mother receipt implementation
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout reviewed Coach UI sender
        uses: actions/checkout@v4
        with:
          repository: ctmansfield/coach
          ref: 1900d64b4b73706bd0a06871985502b8967f2911
          path: paired-coach
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only contract validator dependency
        run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Require exact pinned Coach sender commit
        run: |
          actual=$(git -C paired-coach rev-parse HEAD)
          test "$actual" = "1900d64b4b73706bd0a06871985502b8967f2911"
      - name: Test post-commit receipt loss and archived verification
        env:
          COACH_CHECKOUT: ${{ github.workspace }}/paired-coach
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/paired-coach
        run: python -m unittest discover -s tests/physiology -p test_receipt_recovery.py -v
      - name: Rerun pinned Coach→Mother archive/replay checks
        env:
          COACH_CHECKOUT: ${{ github.workspace }}/paired-coach
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/paired-coach
        run: python -m unittest discover -s tests/physiology -p test_capture_ui_crossrepo.py -v
      - name: Rerun durable manual event ingestion checks
        run: python -m unittest discover -s tests/physiology -p test_manual_ingest.py -v
