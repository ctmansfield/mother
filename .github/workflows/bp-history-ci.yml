name: Historical archive
on: [push, pull_request]
permissions:
  contents: read
jobs:
  history-source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify synthetic age tools
        run: |
          curl -fsSL https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz -o "$RUNNER_TEMP/history-age.tar.gz"
          printf '%s  %s\n' cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 "$RUNNER_TEMP/history-age.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/history-age.tar.gz" -C "$RUNNER_TEMP" age/age age/age-keygen
      - name: Run historical source tests
        run: |
          python -m pip install 'jsonschema==4.25.1'
          export MSE_HISTORY_AGE_BIN="$RUNNER_TEMP/age/age"
          export TMPDIR="$(mktemp -d "$RUNNER_TEMP/history-tests.XXXXXX")"
          python -B -m unittest discover -s tests/integration/mse_health_history -v
