name: mother-ci
on:
  push:
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ctmansfield/coach
          ref: 493ed9ca1f746546eb8c19a85c3e30643cc80ded
          path: .paired-coach
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: make install
      - name: Install BROJA test dependency
        run: .venv/bin/python -m pip install -r requirements-broja.txt
      - name: Verify
        run: make verify
      - name: Tests
        env:
          COACH_CHECKOUT: ${{ github.workspace }}/.paired-coach
          PYTHONPATH: .:.paired-coach
          MOTHER_REQUIRE_BROJA: '1'
        run: make test
